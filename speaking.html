<style>
  :root { --bg:#f5f7fb; --card:#fff; --pri:#2563eb; --txt:#1f2937; --mut:#6b7280; --ok:#16a34a; --bad:#dc2626; --line:#d1d5db; --ai:#eef2ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --pri:#3b82f6; --txt:#e5e7eb; --mut:#94a3b8; --line:#334155; --ai:#273449; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100dvh; }
  header { background:var(--card); box-shadow:0 1px 4px #0002; padding:12px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; flex:1; }
  header a { color:var(--pri); font-size:14px; }
  button { cursor:pointer; border:0; border-radius:8px; padding:9px 14px; background:var(--pri); color:#fff; font-size:15px; }
  button.ghost { background:transparent; color:var(--txt); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  main { max-width:620px; margin:0 auto; padding:16px; }
  .mode { display:flex; gap:6px; margin-bottom:14px; align-items:center; }
  .mode span { color:var(--mut); font-size:14px; }
  .mode button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  .scn { display:block; width:100%; text-align:left; background:var(--card); color:var(--txt); border:1px solid var(--line); padding:14px; margin-bottom:10px; border-radius:12px; }
  .scn b { font-size:17px; } .scn small { display:block; color:var(--mut); margin-top:4px; }
  .bubble { max-width:85%; padding:10px 14px; border-radius:14px; margin:8px 0; line-height:1.4; }
  .npc { background:var(--ai); border-bottom-left-radius:4px; }
  .me { background:var(--pri); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .pt { display:block; font-size:13px; opacity:.75; margin-top:3px; }
  .choice { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
  .choice .en { font-size:18px; font-weight:600; }
  .choice .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .res { margin-top:10px; font-size:16px; }
  .w-ok { color:var(--ok); font-weight:600; } .w-bad { color:var(--bad); font-weight:600; text-decoration:underline; }
  .score { font-weight:700; }
  .kw { padding:0 2px; border-radius:4px; transition:background .1s; }
  .kw.on { background:#fde04788; }
  .mic.rec { background:var(--bad); animation:p 1s infinite; }
  @keyframes p { 50% { opacity:.6; } }
  .note { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--mut); margin-bottom:12px; }
  .end { text-align:center; background:var(--card); border-radius:14px; padding:24px; box-shadow:0 2px 8px #0002; }
  .end .big { font-size:36px; font-weight:700; }

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const main = $('#main');
const PASS = 0.999;   // todas as palavras precisam estar corretas
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let mode = localStorage.getItem('eb_mode') || 'guided';   // guided | challenge
let scn, node, log, scores, tries;
let auto = localStorage.getItem('eb_auto') !== '0';   // modo contínuo (microfone abre sozinho)
let session = 0, curRec = null, fails = 0, silent = 0, journey = false, jIdx = 0;

const prog = () => JSON.parse(localStorage.getItem('eb_prog') || '{"xp":0,"streak":0,"last":""}');
function addXP(n) {
  const p = prog(), t = new Date().toISOString().slice(0, 10);
  if (p.last !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    p.streak = p.last === y ? p.streak + 1 : 1; p.last = t;
  }
  p.xp += n; localStorage.setItem('eb_prog', JSON.stringify(p));
}

// normaliza para comparar: números por extenso, contrações, "ok"
const NUM = { 0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',20:'twenty',30:'thirty' };
const norm = s => s.toLowerCase()
  .replace(/\b(\d+)\b/g, (m, n) => NUM[n] || m)
  .replace(/\bi'm\b/g, 'i am').replace(/\bit's\b/g, 'it is').replace(/\bthat's\b/g, 'that is')
  .replace(/\bwhat's\b/g, 'what is').replace(/\bi'll\b/g, 'i will').replace(/\blet's\b/g, 'let us')
  .replace(/\bdon't\b/g, 'do not').replace(/\bok\b/g, 'okay');
const words = s => norm(s).replace(/[^a-z' ]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);

// palavras que o reconhecedor costuma confundir por soarem igual
const HOMO = [['to','too','two'],['for','four'],['no','know'],['by','buy','bye'],['one','won'],['their','there'],['here','hear'],['right','write'],['night','knight'],['our','hour'],['see','sea'],['whether','weather']];
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
// palavra igual (ou quase, em palavras longas, ou homófona)
const same = (x, y) => x === y || (x.length >= 6 && y.length >= 6 && lev(x, y) <= 1) || HOMO.some(g => g.includes(x) && g.includes(y));

// compara esperado x ouvido (LCS) -> marca cada palavra esperada
function compare(expected, heard) {
  const a = words(expected), b = words(heard);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    dp[i][j] = same(a[i-1], b[j-1]) ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const hit = Array(a.length).fill(false);
  let i = a.length, j = b.length;
  while (i > 0 && j > 0) {
    if (same(a[i-1], b[j-1])) { hit[i-1] = true; i--; j--; }
    else if (dp[i-1][j] >= dp[i][j-1]) i--; else j--;
  }
  return { a, hit, score: a.length ? dp[a.length][b.length] / a.length : 0 };
}

function speak(text, rate = 0.9, cb, onb) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate;
  if (cb) u.onend = cb;
  if (onb) u.onboundary = e => { if (e.name === 'word') onb(e.charIndex); };
  window._u = u;   // evita o coletor de lixo do Chrome engolir o evento onend
  speechSynthesis.speak(u);
}

/* ===== Telas ===== */
function menu() {
  session++; stopRec(); journey = false;
  speechSynthesis.cancel();
  const P = prog();
  const hist = JSON.parse(localStorage.getItem('eb_speak') || '{}');
  main.innerHTML = `
    ${SR ? '' : '<div class="note">⚠️ Seu navegador não suporta reconhecimento de voz. Use o <b>Chrome</b> ou <b>Edge</b> para falar. Por enquanto você poderá digitar.</div>'}
    <div class="note" style="display:flex;gap:16px;color:var(--txt)"><span>⭐ <b>${P.xp}</b> XP</span><span>🔥 <b>${P.streak}</b> dia(s) seguidos</span></div>
    <button class="scn" id="journeyBtn" style="border-color:var(--pri)"><b>🚀 Jornada completa</b><small>Todos os cenários em sequência, sem parar. Ideal para treinar contínuo.</small></button>
    <div class="mode"><span>Modo:</span>
      <button class="ghost ${mode==='guided'?'on':''}" data-m="guided">Guiado</button>
      <button class="ghost ${mode==='challenge'?'on':''}" data-m="challenge">Desafio</button>
      <button class="ghost ${auto?'on':''}" id="autoBtn" title="O microfone abre sozinho depois que o Buddy fala">🎙️ Contínuo: ${auto?'ligado':'desligado'}</button></div>
    <div class="note">${mode==='guided' ? 'Guiado: você vê a frase em inglês e a tradução.' : 'Desafio: você só vê o português. Tente dizer em inglês de cabeça! (use 👁 se travar)'}</div>
    ${SCENARIOS.map(s => `<button class="scn" data-id="${s.id}"><b>${s.icon} ${s.name}</b>
      <small>${s.desc}${hist[s.id] ? ` · Melhor nota: ${hist[s.id]}%` : ''}</small></button>`).join('')}`;
  main.querySelectorAll('.mode button[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; localStorage.setItem('eb_mode', mode); menu(); });
  $('#autoBtn').onclick = () => { auto = !auto; localStorage.setItem('eb_auto', auto ? '1' : '0'); menu(); };
  $('#journeyBtn').onclick = () => { journey = true; jIdx = 0; start(SCENARIOS[0]); };
  main.querySelectorAll('.scn').forEach(b => b.onclick = () => start(SCENARIOS.find(s => s.id === b.dataset.id)));
}

function start(s) { scn = s; node = s.start; log = []; scores = []; turn(); }

function turn() {
  session++; stopRec(); fails = 0; silent = 0;
  const tok = session;
  const n = scn.n[node];
  main.innerHTML = `<button class="ghost" id="back">← Cenários</button>
    ${journey ? `<span style="color:var(--mut);font-size:14px;margin-left:8px">Jornada ${jIdx + 1}/${SCENARIOS.length} · ${scn.icon} ${scn.name}</span>` : ''}
    <div id="log"></div>
    <div id="npc"></div>
    ${SR ? `<div style="display:flex;gap:10px;align-items:center;margin:10px 0"><div id="status" style="flex:1;color:var(--mut);font-size:14px"></div><button class="ghost" id="listenNow">🎤 Ouvir agora</button></div>` : ''}
    <div id="choices"></div>`;
  if (SR) $('#listenNow').onclick = () => { silent = 0; speechSynthesis.cancel(); autoListen(session); };
  $('#back').onclick = menu;
  $('#log').innerHTML = log.map(l => `<div class="bubble ${l.who}">${l.en}<span class="pt">${l.pt}</span></div>`).join('');
  // fala do Buddy: palavras destacadas conforme ele fala (para acompanhar a leitura)
  const spans = [];
  n.npc[0].replace(/\S+/g, (m, off) => { spans.push(`<span class="kw" data-o="${off}">${m}</span>`); });
  $('#npc').innerHTML = `<div class="bubble npc" style="font-size:21px">${spans.join(' ')} <button class="ghost" id="rep" style="padding:2px 8px">🔊</button><span class="pt" style="font-size:16px">${n.npc[1]}</span></div>`;
  const hl = off => { let cur = null; $('#npc').querySelectorAll('.kw').forEach(k => { k.classList.remove('on'); if (+k.dataset.o <= off) cur = k; }); if (cur) cur.classList.add('on'); };
  const clr = () => $('#npc').querySelectorAll('.kw').forEach(k => k.classList.remove('on'));
  const sayNpc = rate => speak(n.npc[0], rate, () => { clr(); if (tok === session && auto && SR) setTimeout(() => autoListen(tok), 250); }, hl);
  $('#rep').onclick = () => { stopRec(); sayNpc(0.9); };
  tries = {};
  setStatus(auto && SR ? '🔊 Buddy está falando... leia e acompanhe' : '');
  sayNpc(0.9);
  $('#choices').innerHTML = `<div style="font-size:17px;font-weight:600;margin-top:16px">🗣️ Sua vez! Diga uma das opções:</div>` +
    n.ch.map((c, i) => `<div class="choice" data-i="${i}">
      <div class="en" style="font-size:20px">${mode==='guided' ? c[0] : '<span class="hid">• • •</span>'}</div>
      <div class="pt" style="color:var(--mut);font-size:15px">${c[1]}</div>
      <div class="row">
        ${auto && SR ? '' : SR ? `<button class="mic" data-i="${i}">🎤 Falar</button>` : `<input class="typed" placeholder="Digite em inglês" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line)"><button class="send" data-i="${i}">Enviar</button>`}
        <button class="ghost lis" data-i="${i}">🔊 Modelo</button>
        <button class="ghost slow" data-i="${i}">🐢 Devagar</button>
        ${mode==='challenge' ? `<button class="ghost eye" data-i="${i}">👁</button>` : ''}
      </div>
      <div class="res"></div></div>`).join('');
  const box = i => main.querySelector(`.choice[data-i="${i}"]`);
  main.querySelectorAll('.lis').forEach(b => b.onclick = () => speak(n.ch[b.dataset.i][0]));
  main.querySelectorAll('.slow').forEach(b => b.onclick = () => speak(n.ch[b.dataset.i][0], 0.55));
  main.querySelectorAll('.eye').forEach(b => b.onclick = () => { box(b.dataset.i).querySelector('.en').textContent = n.ch[b.dataset.i][0]; });
  main.querySelectorAll('.mic').forEach(b => b.onclick = () => listen(+b.dataset.i, b));
  main.querySelectorAll('.send').forEach(b => b.onclick = () => {
    const i = +b.dataset.i; evaluate(i, [box(i).querySelector('.typed').value]);
  });
}

const setStatus = t => { const el = $('#status'); if (el) el.innerHTML = t; };
function stopRec() { const r = curRec; curRec = null; if (r) { try { r.abort(); } catch (_) {} } }

// Escuta contínua: abre o microfone sozinho e descobre qual das opções o aluno disse
function autoListen(tok) {
  if (tok !== session) return;
  stopRec();
  const n = scn.n[node];
  const rec = new SR(); curRec = rec;
  rec.lang = 'en-US'; rec.maxAlternatives = 3; rec.interimResults = true;
  let got = false;
  setStatus('🎙️ <b style="color:var(--bad)">Ouvindo...</b> pode falar, sem pressa');
  rec.onresult = e => {
    if (tok !== session) return;
    const r = e.results[e.results.length - 1];
    if (!r.isFinal) { setStatus(`🎙️ <b style="color:var(--bad)">Ouvindo:</b> “${r[0].transcript}”`); return; }
    got = true;
    const heard = Array.from(r).map(x => x.transcript);
    let bi = 0, bs = -1;
    n.ch.forEach((c, i) => heard.forEach(h => { const s = compare(c[0], h).score; if (s > bs) { bs = s; bi = i; } }));
    if (bs < 0.35) {
      fails++;
      setStatus(`Eu ouvi: "${heard[0]}". Não entendi, diga uma das opções acima.`);
      setTimeout(() => autoListen(tok), 900);
    } else evaluate(bi, heard, true);
  };
  rec.onerror = e => { if (e.error === 'not-allowed') { setStatus('⚠️ Permita o microfone no navegador e clique em 🎤 Ouvir agora.'); curRec = null; } };
  rec.onend = () => {
    if (tok !== session || got || curRec !== rec) return;
    silent++;
    if (silent >= 40) { setStatus('⏸ Pausado. Clique em 🎤 Ouvir agora para continuar.'); curRec = null; return; }
    if (silent === 4) setStatus('🙂 Sem pressa! O Buddy espera você. Leia as opções e fale quando quiser.');
    setTimeout(() => autoListen(tok), 300);
  };
  try { rec.start(); } catch (_) {}
}

function listen(i, btn) {
  speechSynthesis.cancel(); stopRec();
  const rec = new SR();
  rec.lang = 'en-US'; rec.maxAlternatives = 3; rec.interimResults = false;
  btn.classList.add('rec'); btn.textContent = '🎙️ Ouvindo...';
  const done = () => { btn.classList.remove('rec'); btn.textContent = '🎤 Falar'; };
  rec.onresult = e => { done(); evaluate(i, Array.from(e.results[0]).map(r => r.transcript)); };
  rec.onerror = e => { done(); showRes(i, `<span class="w-bad">Não consegui ouvir (${e.error === 'not-allowed' ? 'permita o microfone' : e.error}).</span>`); };
  rec.onend = done;
  try { rec.start(); } catch (_) { done(); }
}

const showRes = (i, html) => { main.querySelector(`.choice[data-i="${i}"] .res`).innerHTML = html; };

function evaluate(i, heardList, viaAuto = false) {
  const tok = session;
  const c = scn.n[node].ch[i];
  // melhor alternativa do reconhecedor
  let best = null, bestHeard = '';
  heardList.forEach(h => { const r = compare(c[0], h); if (!best || r.score > best.score) { best = r; bestHeard = h; } });
  const pct = Math.round(best.score * 100);
  const colored = best.a.map((w, k) => `<span class="${best.hit[k] ? 'w-ok' : 'w-bad'}">${w}</span>`).join(' ');
  tries[i] = (tries[i] || 0) + 1;
  if (best.score >= PASS) {   // só passa com TODAS as palavras corretas
    const ls = Math.max(40, 100 - 20 * fails);   // nota da frase: cai a cada tentativa errada
    showRes(i, `${colored}<div class="score" style="color:var(--ok)">✅ ${fails ? 'Agora sim! Muito bem!' : 'Perfeito!'}</div>
      <div style="color:var(--mut);font-size:13px">Eu ouvi: "${bestHeard}"</div>`);
    stopRec(); setStatus('✅ Ótimo! Vamos continuar...'); addXP(Math.round(ls / 10)); fails = 0;
    scores.push(ls);
    log.push({ who:'npc', en:scn.n[node].npc[0], pt:scn.n[node].npc[1] }, { who:'me', en:c[0], pt:c[1] });
    main.querySelectorAll('button').forEach(b => { if (b.id !== 'back') b.disabled = true; });
    const next = c[2];
    setTimeout(() => { if (next) { node = next; turn(); } else finish(); }, 1600);
  } else {
    fails++;
    const wrong = best.a.filter((w, k) => !best.hit[k]);
    showRes(i, `${colored}<div class="score" style="color:var(--bad)">Quase! Faltou falar: <b>${wrong.join(', ')}</b></div>
      <div style="color:var(--mut);font-size:13px">Eu ouvi: "${bestHeard || '(nada)'}"</div>
      ${(tries[i] >= 4 || fails >= 4) ? '<button class="ghost skip" style="margin-top:8px">Não consigo, pular ⏭</button>' : ''}`);
    if (viaAuto && tok === session) {
      // o Buddy mostra a pronúncia das palavras erradas e escuta de novo
      setStatus(`🐢 Ouça e repita: <b>${wrong.join(', ')}</b>`);
      const again = () => setTimeout(() => autoListen(tok), 300);
      speak(wrong.join('. '), 0.6, fails >= 2 ? () => speak(c[0], 0.6, again) : again);
    }
    const sk = main.querySelector(`.choice[data-i="${i}"] .skip`);
    if (sk) sk.onclick = () => { scores.push(0); log.push({ who:'npc', en:scn.n[node].npc[0], pt:scn.n[node].npc[1] }, { who:'me', en:c[0], pt:c[1] }); if (c[2]) { node = c[2]; turn(); } else finish(); };
  }
}

function finish() {
  session++; stopRec();
  const tk = session;
  const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
  const hist = JSON.parse(localStorage.getItem('eb_speak') || '{}');
  hist[scn.id] = Math.max(hist[scn.id] || 0, avg);
  localStorage.setItem('eb_speak', JSON.stringify(hist));
  main.innerHTML = `<div id="log">${log.map(l => `<div class="bubble ${l.who}">${l.en}<span class="pt">${l.pt}</span></div>`).join('')}</div>
    <div class="end"><div class="big">${avg}%</div>
    <p>${avg >= 90 ? 'Excelente pronúncia! 🌟' : avg >= 75 ? 'Muito bom! 👏' : 'Boa tentativa! Repita para melhorar. 💪'}</p>
    ${journey && jIdx < SCENARIOS.length - 1 ? `<p class="mut" style="color:var(--mut)">Próximo: ${SCENARIOS[jIdx + 1].icon} ${SCENARIOS[jIdx + 1].name} (começa sozinho em 6s)</p><button id="next">Próximo cenário ▶</button> ` : (journey ? '<p>🏆 Jornada completa! Parabéns!</p>' : '')}
    <button class="ghost" id="again">Repetir</button> <button class="ghost" id="menu">Outros cenários</button></div>`;
  $('#again').onclick = () => start(scn); $('#menu').onclick = menu;
  if (journey && jIdx < SCENARIOS.length - 1) {
    const go = () => { jIdx++; start(SCENARIOS[jIdx]); };
    $('#next').onclick = go;
    if (auto) setTimeout(() => { if (tk === session) go(); }, 6000);
  }
}

menu();
</script>
</body>
</html>
